name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: llm_meter
          POSTGRES_PASSWORD: llm_meter
          POSTGRES_DB: llm_meter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llm_meter -d llm_meter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://llm_meter:llm_meter@localhost:5432/llm_meter_test
      JWT_SECRET: test-jwt-secret
      LOGIN: admin
      PASSWORD_HASH: $2a$10$o5a7y81tSVshlMT9yKeCROtM9C1KAuk3k1qOWpXHpTXm0oBP2PhIO

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build backend
        run: npm run build

      - name: Migrate test database
        run: node dist/scripts/migrate.js

      - name: Test
        run: npm test

      - name: Build web
        run: |
          cd web
          npm ci
          npm run build
